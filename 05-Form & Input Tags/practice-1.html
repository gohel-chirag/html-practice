<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Input Tags Practice-1 | Web Development</title>
</head>
<body>
    
    <h1>Student Registeration Form</h1>
    
    <form action="" method="post">
        <!-- Name -->
        <div>
            <label for="Name">Name : </label><input type="text" name="name" id="name" autofocus required placeholder="Enter Your Name..">
        </div><br>

        <!-- Email -->
        <div>
            <label for="Email">Email : </label><input type="email" name="email" id="email" required placeholder="Enter Your Email..">
        </div><br>

        <!-- Password -->
        <div>
            <label for="Password">Password : </label><input type="password" name="password" id="password" required placeholder="Enter Password**">
        </div><br>

        <!-- Radio Button -->
        <div>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </div><br>

        <!-- Course -->
        <div>
            <label for="course">Course : </label>
            <select name="course" id="course">
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BCOM">BCOM</option>
                <option value="BA">BA</option>
                <option value="BSC It">BSC It</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
                <option value="MCOM">MCOM</option>
                <option value="MA">MA</option>
                <option value="MSC It">MSC It</option> 
            </select>
        </div><br>

        <!-- Address -->
        <div>
            <label for="address">Address : </label>
            <textarea name="address" id="address" rows="" cols="30" required placeholder="Enter Your Address!!"></textarea>
        </div><br><br>

        <!-- Buttons -->
        <div>
            <button type="submit" >REGISTER</button>
            <button type="reset">RESET</button>
        </div>
    </form>

</body>
</html>
