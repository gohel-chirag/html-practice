<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Input Tags | Web Development</title>
</head>
<body>
    

    <!-- Main Heading -->
    <h1>Form & Input Tags :</h1>
    <hr>


    <!-- Form Example -->
    <h2>Register Form Example :</h2>

    <!-- Form -->
    <form action="" method="">
        <!-- Name (input:text) -->
        <div>
            <label for="Name">Name :</label>
            <input type="text" name="name" id="" placeholder="Enter Name..." autofocus required>
        </div>
        
        <!-- Password (input:password) -->
        <div>
            <label for="Password">Password :</label>
            <input type="password" name="password" id="" placeholder="Enter Password**" required>
        </div>

        <!-- Radio Button (input:radio) -->
        <div>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
        </div>

        <!-- Textarea (input:textarea) -->
        <div>
            <label for="address">Address :</label><br>
            <textarea name="address" id="address" rows="5" cols="30" placeholder="Enter Your Address" required></textarea>
        </div>

        <!-- Select (input:select) -->
        <label for="city">City :</label>
        <select name="city" id="city">
            <option value="Rajkot">Rajkot</option>
            <option value="Ahmedabad">Ahmedabad</option>
            <option value="Surat">Surat</option>
            <option value="Jamnagar">Jamnagar</option>
        </select>

        <!-- Checkbox (input:checkbox) -->
        <div>
            <input type="checkbox" name="t&c" id="">
            <label for="t&c">I Agree T&C</label>
        </div>

        <!-- Buttons -->
        <div>
            <button type="submit">SUBMIT</button>&nbsp;
            <button type="reset">RESET</button>
        </div>
    </form>
    <hr>
</body>
</html>
