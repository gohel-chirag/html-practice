<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video & Audio | Web Development</title>
</head>
<body>
    
    <h1>Video & Audio Tag Example :</h1>
    <hr>


    <!-- Video Example -->
    <h3>Video Example :</h3>
    <video src="video.mp4" width="400" height="" muted controls autoplay loop alt="Video Example"></video>
    <hr>


    <!-- Audio Example -->
    <h3>Audio Example :</h3>
    <audio src="audio.mp3" controls></audio>
    <hr>


    <!-- iframe Example -->
    <h3>iframe Example :</h3>
    <iframe src="https://www.wikipedia.org/" frameborder="1" width="500" height="280"></iframe>
    <hr>


    <!-- Youtube Vide Example -->
    <h3>Youtube Video Example :</h3>
    <iframe width="500" height="280" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=GwOV4sXjyBziUXYE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <hr>


    <!-- Google Map Example -->
    <h3>Google Map Example : </h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14766.300082134565!2d70.76702661168795!3d22.29408272884957!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3959ca1b9f15ea33%3A0x102ce1edce0bbe9!2sGeetanjali%20Group%20of%20Colleges%2C%20Rajkot%20-%20Best%20BCA%20College%20in%20Rajkot%20%7C%20BBA%20College%20%7C%20Commerce%20College%20%7C%20Law%20College%20in%20Rajkot!5e0!3m2!1sen!2sin!4v1787163337461!5m2!1sen!2sin" width="500" height="280" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <hr>
</body>
</html>
