<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link & Image | Web Development</title>
</head>
<body>
    

    <h1>Link & Image Example</h1>
    <hr>


    <!-- Link Example -->
    <h3>Link Example :</h3>
    <a href="https://www.google.com/" target="_blank">Google</a>&nbsp;
    <a href="https://www.youtube.com/" target="_blank">Youtube</a>&nbsp;
    <a href="https://www.facebook.com/" target="_blank">Facebook</a>&nbsp;
    <a href="https://www.whatsapp.com/" target="_blank">Whatsapp</a>&nbsp;
    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
    <hr>


    <!-- Normal Image Example -->
    <h3>Image Example :</h3>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/072/929/774/small/a-finger-touches-a-digital-screen-displaying-a-web-development-interface-with-icons-representing-coding-cloud-computing-database-and-website-design-symbolizing-innovation-and-technological-advancement-photo.jpg" alt="Normal Image Example" width="300px" height="200px" target="_blank">
    <hr>


    <!-- Image With Link Example -->
    <h3>Image With Link Example :</h3>
    <a href="https://www.youtube.com/" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/128/1384/1384060.png" alt="Youtube Image With Link Example" width="200px" height="200px">
    </a> &nbsp;&nbsp;&nbsp;

    <a href="https://www.facebook.com/" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/128/5968/5968764.png" alt="Facebook Image With Link Example" width="200px" height="200px">
    </a> &nbsp;&nbsp;&nbsp;

    <a href="https://www.whatsapp.com/" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/128/15707/15707820.png" alt="Whatsapp Image With Link Example" width="200px" height="200px">
    </a> &nbsp;&nbsp;&nbsp;

    <a href="https://www.instagram.com/" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/128/4138/4138124.png" alt="Instagram Image With Link Example" width="200px" height="200px">
    </a>
    <hr>


</body>
</html>
