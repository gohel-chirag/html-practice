    <!-- Main Heading -->

    <!-- Id Example -->
    <h3>Id Example :</h3>
    <p id="id1">id1 No use karel element</p>
    <p id="id2">id2 No use karel element</p>
    <!-- Id No use karel element ne unique banave chhe. Ekj page ma ekj id no use kari sakay chhe. -->

    <!-- Class Example -->

    <p class="Child">Child Class no use karel</p>
    <!-- Class No use karel element ne group banave chhe. Ekj page ma ekj class no use kari sakay chhe. -->
