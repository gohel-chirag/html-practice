<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id & Class Practice-1 | Web Development</title>
    <style>
        /* Direct Element */
        html{
            scroll-behavior: smooth;
        }
        
        h1, nav{
            text-align: center;
        }
        

        /* Class */
        .section{
            height: 90vh;
            text-align: center;
        }


        /* Id */
        #home{
            background-color: rgb(100, 100, 201);
        }

        #about{
            background-color: rgb(223, 78, 78);
        }

        #projects{
            background-color: rgb(78, 223, 78);
        }

        #contact{
            background-color: rgb(223, 223, 78);
        }
    </style>
</head>
<body>
    

    <!-- Id & Class Practice-1 -->
    <h1>Id & Class Practice-1</h1>
    <hr>

    <nav>
        <a href="#home">Home</a>&nbsp;&nbsp;
        <a href="#about">About</a>&nbsp;&nbsp;
        <a href="#projects">Projects</a>&nbsp;&nbsp;
        <a href="#contact">Contact</a>
    </nav>
    <hr>

    <section id="home" class="section">
        <h1>Hi, I'm Chirag</h1>
    </section>

    <section id="about" class="section">
        <h2>About Me</h2>
    </section>

    <section id="projects" class="section">
        <h2>My Projects</h2>
    </section>

    <section id="contact" class="section">
        <h2>Contact</h2>
    </section>


</body>
</html>
